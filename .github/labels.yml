# --- Severity (impact-based; see defects/SEVERITY.md) ---
- name: "sev:P1"
  color: "b60205"
  description: "Blocker — core flow halted / correctness / security / funds"
- name: "sev:P2"
  color: "d93f0b"
  description: "Major — key feature broken, but completable another way"
- name: "sev:P3"
  color: "fbca04"
  description: "Minor — degraded/recoverable, doesn't block core flow"
- name: "sev:P4"
  color: "c2e0c6"
  description: "Trivial — cosmetic only, zero functional impact"

# --- Status (defect state machine) ---
- name: "status:filed"
  color: "ededed"
  description: "In Triage — not yet validated"
- name: "status:needs-info"
  color: "f9d0c4"
  description: "Waiting on the tester — reply with repro details within ~7 days or it closes as rejected"
- name: "status:accepted"
  color: "0e8a16"
  description: "Triage confirms real + reproducible (rewardable)"
- name: "status:routed"
  color: "006b75"
  description: "Tagged with ownership and sent upstream"
- name: "status:closed"
  color: "5a5a5a"
  description: "Closed — the paired resolution:* label says why"

# --- Resolution (exactly one, applied when a defect reaches status:closed;
# tells the tester what the close means for their reward) ---
- name: "resolution:fixed"
  color: "0e8a16"
  description: "Closed as fixed — the defect was real and resolved (still counts toward rewards)"
- name: "resolution:rejected"
  color: "d73a4a"
  description: "Closed as not a defect — not reproducible, out of bounds, or working as intended (not counted)"
- name: "resolution:duplicate"
  color: "cfd3d7"
  description: "Closed as duplicate — the shared root cause (rc:*) credits the first filer"

# --- Type / aggregation ---
- name: "feedback"
  color: "c5def5"
  description: "Submitted through the Submit Feedback form (auto-applied)"
- name: "feature-request"
  color: "a2eeef"
  description: "Feature Request feedback — recorded, never reward-eligible"
- name: "defect"
  color: "e99695"
  description: "Bug Report in the defect pipeline (auto-applied at intake; confirmation happens at status:accepted)"
- name: "coverage-log"
  color: "bfdadc"
  description: "Ecosystem dApp coverage log"
- name: "systemic"
  color: "fef2c0"
  description: "Confirmed cross-app root cause — the one issue N duplicates collapse into"
- name: "needs:manual-label"
  color: "d4c5f9"
  description: "Auto-labeller could not derive an area from the form — triage by hand"
- name: "needs:dapp-report-url"
  color: "d4c5f9"
  description: "Tester action: comment the dApp's own report/support URL on this ecosystem bug"
# `rc:<CODE>` labels (e.g. rc:CHAIN_ID_MISSING) are created on demand at triage
# to group every issue sharing a root cause. See .github/TRIAGE.md.

# --- Sign-up & L0 (GitHub-native registration + survey tracking) ---
- name: "signup"
  color: "0e8a16"
  description: "Testing sign-up issue — the tester's authenticated identity + wallet"
- name: "signup:needs-fix"
  color: "d4c5f9"
  description: "Sign-up needs a correction (invalid wallet, or a secret pasted)"
- name: "signup:duplicate"
  color: "cfd3d7"
  description: "A repeat sign-up — folded into the tester's earlier (canonical) issue and closed"
- name: "l0:studio-done"
  color: "c2e0c6"
  description: "0G Studio Survey submitted (set by the Google Forms bridge)"
- name: "l0:pc-done"
  color: "c2e0c6"
  description: "0G Private Computer Survey submitted (set by the Google Forms bridge)"
- name: "l0:cleared"
  color: "0e8a16"
  description: "Both L0 surveys received — L0 Recruit cleared"
