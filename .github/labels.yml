# Label taxonomy for 0G Test Week defect tracking — the source of record.
# Apply/refresh on GitHub with: scripts/setup-labels-and-board.sh
# Human-readable guide (testers + maintainers): docs/LABELS.md
#
# Axes are orthogonal: every triaged defect carries one area:, one sev:, a
# status:, and (when derivable from the form) one product:. A closed defect
# also carries exactly one resolution:. `rc:` labels are created on demand to
# group a shared root cause.

# --- Area (routing bucket) ---
- name: "area:app-suite"
  color: "1d76db"
  description: "0G App / Genome / 0G Chat / PandaClaw"
- name: "area:0g-infra"
  color: "0052cc"
  description: "0G Hub / 0G Storage Scan / Chain Scan / 0G Code to Coin"
- name: "area:ecosystem"
  color: "5319e7"
  description: "Ecosystem dApp coverage — useful, but outside core reward tiers"

# --- Product (auto-derived from the form's Product dropdown; lets anyone
# filter existing reports for one product before filing — duplicates credit
# the first filer, so check first). Keep in lockstep with data/targets.json,
# add-defects-to-board.yml, and scripts/setup-labels-and-board.sh. ---
