name: Add defects to board

# Routes Submit Feedback issues (label `feedback`) by their Category field:
# Bug Report is promoted into the defect pipeline — `defect` + `status:filed` +
# an `area:*` derived from Product — and dropped on the board in Triage.
# Feature Request / Other stay plain feedback (Feature Request also gets
# `feature-request`) and never enter the defect pipeline or reward export.
# Ecosystem dApps are useful coverage, but L1-L3 rewards come from accepted
# App Suite / 0G Infra bugs.
# `sev:*` is never auto-applied: severity is a maintainer call at triage.
# Manually adding `defect` (including to legacy old-form issues) routes through
# the same board logic.
#
# Requires a repo secret `PROJECT_PAT` — a token with `project` + `repo` +
# `read:org` scope. The default GITHUB_TOKEN cannot write an org Projects v2 board.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

jobs:
  add-to-board:
    # Only act on the intake events: a freshly opened issue, or someone manually
    # adding the `feedback` / `defect` label to an existing issue. Without the
    # second clause this job re-fires on *every* later `labeled` event (area:*,
    # sev:*, status:accepted, rc:*, systemic…), each time re-stamping
    # `status:filed` and forcing the board back to Triage — clobbering the
    # maintainer's triage progress. (The run that promotes a Bug Report by
    # adding `defect` does trigger one more `labeled: defect` run — every
    # operation here is idempotent and the ecosystem coverage comment is gated on
    # `opened`, so that re-fire is a harmless no-op.)
    if: >-
      (contains(github.event.issue.labels.*.name, 'feedback') ||
       contains(github.event.issue.labels.*.name, 'defect')) &&
      (github.event.action == 'opened' ||
       github.event.label.name == 'feedback' ||
       github.event.label.name == 'defect')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }}
      OWNER: 0gfoundation
      REPO: ${{ github.repository }}
      PROJECT_NUMBER: "19"
      ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      EVENT_ACTION: ${{ github.event.action }}
      HAS_DEFECT: ${{ contains(github.event.issue.labels.*.name, 'defect') }}
    steps:
      - name: Route by Category and add Bug Reports to the board
        run: |
          set -euo pipefail

          # Parse GitHub issue-form markdown: field labels render as "### <Label>"
          # headings, so these strings must match the form labels byte-for-byte.
          BODY=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq .body)
          get_field() {
            awk -v name="$1" '
              $0 == "### " name { found=1; next }
              found && /^### / { exit }
              found && NF { print; exit }
            ' <<<"$BODY"
          }

          CATEGORY=$(get_field "Category")
          PRODUCT=$(get_field "Product")
          echo "Parsed Category=[$CATEGORY] Product=[$PRODUCT]"

          # Category gate: only Bug Report enters the defect pipeline. Issues
          # already labelled `defect` (manual promotion, legacy old-form intake)
          # skip the gate. Everything else is recorded and left off the board —
          # it never carries `defect`/`status:*`, so the reward export never
          # sees it.
          if [ "$HAS_DEFECT" != "true" ]; then
            case "$CATEGORY" in
              "Bug Report"*) ;;
              "Feature Request"*)
                gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "feature-request" >/dev/null
                echo "Feature Request recorded — not entering the defect pipeline."
                exit 0 ;;
              *)
                echo "Category [$CATEGORY] recorded as plain feedback — not entering the defect pipeline."
                exit 0 ;;
            esac
          fi

          # Keep label state in sync with the board state. This is idempotent and
          # covers issues that were manually labelled `defect` outside the form.
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "defect" --add-label "status:filed" >/dev/null

          # Product → area map. Product names track data/targets.json; keep this
          # case in lockstep with the backfill in scripts/setup-labels-and-board.sh.
          # If no case matches the case falls through and we flag the issue for a
          # human instead of silently shipping it unlabelled. `sev:*` is never
          # applied here — maintainers assign severity at triage.
          NEEDS_MANUAL=0
          IS_ECOSYSTEM=0
          AREA=""

          case "$PRODUCT" in
            "0G App"|"Genome"|"0G Chat"|"PandaClaw")
              AREA="area:app-suite" ;;
            "0G Hub"|"0G Storage Scan"|"Chain Scan"|"0G Code to Coin"*)
              AREA="area:0g-infra" ;;
            "TradeGPT"|"Jaine"|"Oku"|"AI Arena"|"CARV"|"Cygnus Finance"|"DataHive"|"Khalani"|"Merkl")
              AREA="area:ecosystem" ;;
            "Other Ecosystem dApp"*)
              # Legacy old-form option.
              AREA="area:ecosystem" ;;
            "Other"*)
              echo "::warning::Product is Other — a maintainer assigns the area at triage."
              NEEDS_MANUAL=1 ;;
            *)
              # Legacy old-form bodies carry an Ownership dropdown instead.
              OWNERSHIP=$(get_field "Ownership")
              case "$OWNERSHIP" in
                "App Suite"*) AREA="area:app-suite" ;;
                "0G Infra"*) AREA="area:0g-infra" ;;
                "Ecosystem dApp"*) AREA="area:ecosystem" ;;
                *) echo "::warning::Could not derive an area from Product=[$PRODUCT] or Ownership=[$OWNERSHIP]"; NEEDS_MANUAL=1 ;;
              esac ;;
          esac

          if [ "$AREA" = "area:ecosystem" ]; then
            IS_ECOSYSTEM=1
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "area:ecosystem" --add-label "coverage-log" >/dev/null
          elif [ -n "$AREA" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$AREA" >/dev/null
          fi

          if [ "$NEEDS_MANUAL" -eq 1 ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "needs:manual-label" >/dev/null
          fi

          # Ecosystem dApp findings are useful coverage, but higher reward tiers
          # come from accepted App Suite / 0G Infra bugs. Nudge once, on open, to
          # also report actionable dApp bugs to the dApp's own channel. (Gated on
          # `opened` so the re-fire from adding `defect` above cannot double-post.)
          if [ "$IS_ECOSYSTEM" -eq 1 ] && [ "$EVENT_ACTION" = "opened" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Thanks — Ecosystem dApp findings are useful coverage in this Hub. If you are aiming for higher L1–L3 rewards, prioritize accepted bugs in **0G App Suite** and **0G Infra**. If this dApp bug is actionable, please also report it to the dApp's own channel and paste that link here as a comment so triage can follow up."
          fi

          # Resolve the board id, Status field id, and the "Triage" option id at
          # runtime, so this keeps working even if the board is recreated.
          read -r PROJECT_ID FIELD_ID OPTION_ID < <(
            gh api graphql -f query='
              query($l:String!,$n:Int!){
                organization(login:$l){ projectV2(number:$n){
                  id
                  field(name:"Status"){
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }}
              }' -F l="$OWNER" -F n="$PROJECT_NUMBER" \
              --jq '.data.organization.projectV2 | "\(.id) \(.field.id) \(.field.options[] | select(.name=="Triage") | .id)"'
          )

          if [ -z "${OPTION_ID:-}" ]; then
            echo "Could not resolve the Triage column — is the board configured?" >&2
            exit 1
          fi

          # Add the issue (no-op if already on the board) and capture the item id.
          ITEM_ID=$(gh api graphql -f query='
            mutation($p:ID!,$c:ID!){
              addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item { id } }
            }' -F p="$PROJECT_ID" -F c="$ISSUE_NODE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          # Park it in Triage.
          gh api graphql -f query='
            mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){
              updateProjectV2ItemFieldValue(input:{
                projectId:$p, itemId:$i, fieldId:$f,
                value:{ singleSelectOptionId:$o }
              }){ projectV2Item { id } }
            }' -F p="$PROJECT_ID" -F i="$ITEM_ID" -F f="$FIELD_ID" -F o="$OPTION_ID" >/dev/null

          echo "Issue #$ISSUE_NUMBER added to the board in Triage."
