name: Add defects to board

# Routes Submit Feedback issues (label `feedback`) by their Category field:
# Bug Report is promoted into the defect pipeline — `defect` + `status:filed` +
# an `area:*` and `product:*` derived from Product — and dropped on the board
# in Triage.
# Feature Request / Other stay plain feedback (Feature Request also gets
# `feature-request`) and never enter the defect pipeline or reward export.
# Ecosystem dApps are useful coverage, but L1-L3 rewards come from accepted
# App Suite / 0G Infra bugs.
# Manually adding `defect` (including to legacy old-form issues) routes through
# the same board logic.
#
# Token split. Intake — labels, Category routing, and the tester-facing
# acknowledgement comments — runs on the default GITHUB_TOKEN. Only the Projects
# v2 board writes use the `PROJECT_PAT` secret (`project` + `repo` + `read:org`),
# because the default token cannot write an org board. When PROJECT_PAT is dead
# the board sync degrades to a warning and intake still completes — see #66 for
# what happened when it could not.

on:
  issues:
    types: [opened, labeled, unlabeled]

permissions:
  contents: read
  issues: write # intake (labels + acknowledgement comments) runs on GITHUB_TOKEN

jobs:
  add-to-board:
    # Act on intake events plus status transitions. Avoid firing on unrelated
    # later labels (area:*, product:*, rc:*…), but keep Project Status in
    # sync when a maintainer changes the issue's single `status:*` label.
    # Re-runs are idempotent and do not re-stamp `status:filed` when one status
    # label already exists. Adding a `status:*` label auto-removes the others
    # (status labels are mutually exclusive); those removals arrive as
    # `unlabeled` events, which this job also handles — re-reading the remaining
    # `status:*` and re-syncing the board (0 left → restore `status:filed`).
    # If multiple `status:*` labels genuinely coexist (a concurrent race), the
    # job flags `needs:manual-label`, comments why, and skips board sync.
    if: >-
      (contains(github.event.issue.labels.*.name, 'feedback') ||
       contains(github.event.issue.labels.*.name, 'defect')) &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' &&
        (github.event.label.name == 'feedback' ||
         github.event.label.name == 'defect')) ||
       ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        startsWith(github.event.label.name, 'status:')))
    runs-on: ubuntu-latest
    env:
      # Two tokens, never mixed. GH_TOKEN is the default token and covers every
      # intake action; PROJECT_PAT is passed explicitly to the board mutations
      # at the end and nowhere else.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
      OWNER: 0gfoundation
      REPO: ${{ github.repository }}
      PROJECT_NUMBER: "19"
      ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      EVENT_ACTION: ${{ github.event.action }}
      TRIGGER_LABEL: ${{ github.event.label.name }}
      HAS_DEFECT: ${{ contains(github.event.issue.labels.*.name, 'defect') }}
    steps:
      - name: Route by Category and add Bug Reports to the board
        run: |
          set -euo pipefail

          # Post (or update) an explanation comment whenever `needs:manual-label`
          # is applied, so the reason lives on the issue — not only in the Actions
          # log. Deduped by an HTML marker: the same PATCH-or-POST pattern as
          # notify-status-change.yml, so re-runs update in place instead of piling
          # up. The latest reason replaces any earlier one.
          post_marker_comment() {
            marker="$1"; msg="$2"
            body=$(printf '%s\n\n%s' "$marker" "$msg")
            cid=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" --paginate \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
            if [ -n "$cid" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$cid" -f body="$body" >/dev/null
            else
              gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
            fi
          }

          MANUAL_LABEL_MARKER="<!-- og-manual-label-reason -->"
          comment_manual_label_reason() {
            post_marker_comment "$MANUAL_LABEL_MARKER" "$1"
          }

          # Intake acknowledgement: tell the filer their submission landed and
          # what happens next, instead of leaving them a bare label trail. Only
          # on `opened` — label-event re-fires must not repost — and deduped by
          # marker anyway, so even a re-run edits in place.
          INTAKE_ACK_MARKER="<!-- og-intake-ack -->"

          # Parse GitHub issue-form markdown: field labels render as "### <Label>"
          # headings, so these strings must match the form labels byte-for-byte.
          BODY=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq .body)
          get_field() {
            awk -v name="$1" '
              $0 == "### " name { found=1; next }
              found && /^### / { exit }
              found && NF { print; exit }
            ' <<<"$BODY"
          }

          CATEGORY=$(get_field "Category")
          PRODUCT=$(get_field "Product")
          echo "Parsed Category=[$CATEGORY] Product=[$PRODUCT]"

          # Category gate: only Bug Report enters the defect pipeline. Issues
          # already labelled `defect` (manual promotion, legacy old-form intake)
          # skip the gate. Everything else is recorded and left off the board —
          # it never carries `defect`/`status:*`, so the reward export never
          # sees it.
          if [ "$HAS_DEFECT" != "true" ]; then
            case "$CATEGORY" in
              "Bug Report"*) ;;
              "Feature Request"*)
                gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "feature-request" >/dev/null
                if [ "$EVENT_ACTION" = "opened" ]; then
                  post_marker_comment "$INTAKE_ACK_MARKER" "📝 **Recorded — thanks for the feature request.** It's logged for the product team. Note: feature requests aren't part of the L1–L3 reward ladder (accepted bug reports are) — unless the docs already promised the behavior, in which case triage may reclassify it as a bug."
                fi
                echo "Feature Request recorded — not entering the defect pipeline."
                exit 0 ;;
              *)
                if [ "$EVENT_ACTION" = "opened" ]; then
                  post_marker_comment "$INTAKE_ACK_MARKER" "📝 **Recorded — thanks for the feedback.** It's logged for the team. If this was actually a reproducible bug, file it again with Category = **Bug Report** so it can enter triage."
                fi
                echo "Category [$CATEGORY] recorded as plain feedback — not entering the defect pipeline."
                exit 0 ;;
            esac
          fi

          # Status labels are mutually exclusive: a defect carries exactly one
          # `status:*` at a time. When a maintainer ADDS a `status:*` label, drop
          # every other `status:*` here so the board never sees ambiguous state —
          # no more "remove the old one by hand". Each removal fires an
          # `unlabeled` event that re-enters this job, but by then only one status
          # remains, so that re-run just re-syncs the board (no label writes) and
          # the single-status state is the fixed point — no loop.
          if [ "$EVENT_ACTION" = "labeled" ]; then
            case "$TRIGGER_LABEL" in
              status:*)
                current_status=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | grep '^status:' || true)
                while IFS= read -r s; do
                  [ -z "$s" ] && continue
                  if [ "$s" != "$TRIGGER_LABEL" ]; then
                    gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$s" >/dev/null
                    echo "Removed superseded status label '$s' (kept '$TRIGGER_LABEL')."
                  fi
                done <<<"$current_status"
                ;;
            esac
          fi

          # Keep label state in sync with the board state. This is idempotent and
          # covers issues that were manually labelled `defect` outside the form,
          # without adding a second status or pushing already-triaged issues back
          # to Triage. Re-read after any mutex removal above so the counts are
          # current. This block also handles the `unlabeled` path: after a
          # `status:*` is removed, 1 left → sync to it; 0 left → restore
          # `status:filed` (Triage) to keep the single-status invariant; ≥2 left
          # (a genuine race) → flag `needs:manual-label` and skip board sync.
          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | tr '\n' ' ')
          status_labels=$(printf '%s\n' "$LABELS" | tr ' ' '\n' | grep '^status:' || true)
          status_count=$(printf '%s\n' "$status_labels" | sed '/^$/d' | wc -l | tr -d ' ')

          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "defect" >/dev/null
          if [ "$status_count" -eq 0 ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "status:filed" >/dev/null
            board_status="status:filed"
          elif [ "$status_count" -eq 1 ]; then
            board_status="$status_labels"
          else
            status_list=$(printf '%s' "$status_labels" | tr '\n' ' ' | sed -E 's/[[:space:]]+$//')
            echo "::warning::Issue has multiple status labels: $status_list"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "needs:manual-label" >/dev/null
            comment_manual_label_reason "🏷️ **Needs a manual status label.** This issue currently carries multiple \`status:*\` labels ($status_list). A defect must have exactly one — this usually means two status changes raced. **Maintainer:** remove the stale \`status:*\` label(s) so only the correct one remains; the board Status and the tester notification will then re-sync automatically."
            board_status=""
          fi

          # Product → area + product:* map. Product names track data/targets.json;
          # keep both cases in lockstep with the backfill in
          # scripts/setup-labels-and-board.sh and the labels in .github/labels.yml.
          # If no case matches the case falls through and we flag the issue for a
          # human instead of silently shipping it unlabelled.
          NEEDS_MANUAL=0
          IS_ECOSYSTEM=0
          AREA=""

          # product:* lets anyone filter existing reports for one product before
          # filing — duplicates credit the first filer, so checking first pays.
          PRODUCT_LABEL=""
          case "$PRODUCT" in
            "0G App") PRODUCT_LABEL="product:0g-app" ;;
            "Genome") PRODUCT_LABEL="product:genome" ;;
            "0G Chat") PRODUCT_LABEL="product:0g-chat" ;;
            "Agent launchpad") PRODUCT_LABEL="product:agent-launchpad" ;;
            # Legacy dropdown option — renamed to Agent launchpad; old bodies still parse.
            "PandaClaw") PRODUCT_LABEL="product:agent-launchpad" ;;
            "0G Hub") PRODUCT_LABEL="product:0g-hub" ;;
            "0G Storage Scan") PRODUCT_LABEL="product:storage-scan" ;;
            "Chain Scan") PRODUCT_LABEL="product:chain-scan" ;;
            "0G Code to Coin"*) PRODUCT_LABEL="product:0g-cc" ;;
            "Zia"|"TradeGPT") PRODUCT_LABEL="product:zia" ;;
            "Jaine") PRODUCT_LABEL="product:jaine" ;;
            "Oku") PRODUCT_LABEL="product:oku" ;;
            "AI Arena") PRODUCT_LABEL="product:ai-arena" ;;
            "CARV") PRODUCT_LABEL="product:carv" ;;
            "Cygnus Finance") PRODUCT_LABEL="product:cygnus" ;;
            "DataHive") PRODUCT_LABEL="product:datahive" ;;
          esac
          if [ -n "$PRODUCT_LABEL" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$PRODUCT_LABEL" >/dev/null
          fi

          case "$PRODUCT" in
            "0G App"|"Genome"|"0G Chat"|"Agent launchpad"|"PandaClaw")
              AREA="area:app-suite" ;;
            "0G Hub"|"0G Storage Scan"|"Chain Scan"|"0G Code to Coin"*)
              AREA="area:0g-infra" ;;
            "Zia"|"TradeGPT"|"Jaine"|"Oku"|"AI Arena"|"CARV"|"Cygnus Finance"|"DataHive")
              AREA="area:ecosystem" ;;
            "Other Ecosystem dApp"*)
              # Legacy old-form option.
              AREA="area:ecosystem" ;;
            "Other"*)
              echo "::warning::Product is Other — a maintainer assigns the area at triage."
              NEEDS_MANUAL=1 ;;
            *)
              # Legacy old-form bodies carry an Ownership dropdown instead.
              OWNERSHIP=$(get_field "Ownership")
              case "$OWNERSHIP" in
                "App Suite"*) AREA="area:app-suite" ;;
                "0G Infra"*) AREA="area:0g-infra" ;;
                "Ecosystem dApp"*) AREA="area:ecosystem" ;;
                *) echo "::warning::Could not derive an area from Product=[$PRODUCT] or Ownership=[$OWNERSHIP]"; NEEDS_MANUAL=1 ;;
              esac ;;
          esac

          if [ "$AREA" = "area:ecosystem" ]; then
            IS_ECOSYSTEM=1
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "area:ecosystem" >/dev/null
          elif [ -n "$AREA" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$AREA" >/dev/null
          fi

          if [ "$NEEDS_MANUAL" -eq 1 ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "needs:manual-label" >/dev/null
            comment_manual_label_reason "🏷️ **Needs a manual area label.** Automation could not derive an \`area:*\` from this issue's Product (\`${PRODUCT:-unset}\`) — either Product is *Other* or the field did not match the known map. **Maintainer:** add the correct \`area:*\` (\`area:app-suite\` · \`area:0g-infra\` · \`area:ecosystem\`) and a \`product:*\` per [TRIAGE.md](../../blob/main/.github/TRIAGE.md#labelling-on-intake), then remove \`needs:manual-label\`."
          fi

          # Intake acknowledgement for a freshly filed Bug Report: labels are on,
          # so tell the filer where their report stands and what each next state
          # means. Gated on `opened` — label-event re-fires must not repost.
          if [ "$EVENT_ACTION" = "opened" ]; then
            post_marker_comment "$INTAKE_ACK_MARKER" "📥 **Received — your bug report is in Triage.**
          A maintainer will try to reproduce it from your steps. What happens next:
          - \`status:accepted\` — confirmed; core **App Suite / 0G Infra** bugs count toward your reward tier
          - \`status:needs-info\` — we couldn't reproduce it yet; **reply on this issue** with the missing details
          - closed + \`resolution:*\` — the resolution comment explains whether it counted

          You'll get a comment here at every status change — no need to watch the board. Label guide: [LABELS.md](../../blob/main/docs/LABELS.md).
          Tip: before your next report, [search existing reports](https://github.com/0gfoundation/0g-testing-hub/issues?q=is%3Aissue+label%3Afeedback) (filter by \`product:*\`) — duplicates credit the first reporter."
          fi

          # Ecosystem dApp findings are useful coverage, but higher reward tiers
          # come from accepted App Suite / 0G Infra bugs. Nudge once, on open, to
          # also report actionable dApp bugs to the dApp's own channel. (Gated on
          # `opened` so the re-fire from adding `defect` above cannot double-post.)
          if [ "$IS_ECOSYSTEM" -eq 1 ] && [ "$EVENT_ACTION" = "opened" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Thanks — Ecosystem dApp findings are useful coverage in this Hub. If you are aiming for higher L1–L3 rewards, prioritize accepted bugs in **0G App Suite** and **0G Infra**. If this dApp bug is actionable, please also report it to the dApp's own channel and paste that link here as a comment so triage can follow up."
          fi

          if [ -z "$board_status" ]; then
            echo "Issue has ambiguous status labels; skipped board Status update."
            exit 0
          fi
          # Map the status label to its board column. Pure bash — no token, no
          # network. An unknown status is an INTAKE problem (a bad label), so it
          # is flagged here on GITHUB_TOKEN and never reaches the board sync.
          case "$board_status" in
            "status:filed")      BOARD_COLUMN="Triage" ;;
            "status:needs-info") BOARD_COLUMN="Needs Info" ;;
            "status:accepted")   BOARD_COLUMN="Accepted" ;;
            "status:routed")     BOARD_COLUMN="Routed" ;;
            "status:closed")     BOARD_COLUMN="Closed" ;;
            *)
              echo "::warning::Unknown status label: $board_status"
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "needs:manual-label" >/dev/null
              comment_manual_label_reason "🏷️ **Needs a manual status label.** The status label \`$board_status\` does not map to a known board column. **Maintainer:** replace it with one of \`status:filed\` · \`status:needs-info\` · \`status:accepted\` · \`status:routed\` · \`status:closed\`, then remove \`needs:manual-label\`."
              exit 0 ;;
          esac

          # ---- Board sync — the ONLY part that needs PROJECT_PAT --------------
          # Everything above has already landed: labels, routing, and the
          # tester-facing acknowledgement. So a dead PAT must degrade the BOARD
          # ONLY.
          #
          # It did not use to. PROJECT_PAT was this job's top-level GH_TOKEN, so
          # when it expired on 2026-07-23 the very first `gh issue view` returned
          # 401 and `set -e` killed the run before any of the above ran — a
          # tester's bug report got no labels, no acknowledgement, nothing at all,
          # for 36 days (#66). Board failure must never become intake failure.
          board_skip() {
            echo "::warning::Board sync skipped for #$ISSUE_NUMBER: $1"
            {
              echo "- **#$ISSUE_NUMBER** — intake completed (labels + acknowledgement); **board sync skipped**: $1"
              echo "  - Back-fill once PROJECT_PAT is restored: \`bash scripts/setup-labels-and-board.sh\`"
            } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          }

          sync_board() {
            if [ -z "${PROJECT_PAT:-}" ]; then
              board_skip "PROJECT_PAT is empty or unset"
              return 0
            fi

            # Resolve the board id, Status field id, and Status options at runtime,
            # so this keeps working even if the board is recreated. Options come
            # back as name=id pairs and are matched in bash, because `gh --jq`
            # takes no arguments to pass the wanted column into.
            local raw PROJECT_ID FIELD_ID OPTION_ID ITEM_ID kv
            local -a parts
            if ! raw=$(GH_TOKEN="$PROJECT_PAT" gh api graphql -f query='
              query($l:String!,$n:Int!){
                organization(login:$l){ projectV2(number:$n){
                  id
                  field(name:"Status"){
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }}
              }' -F l="$OWNER" -F n="$PROJECT_NUMBER" \
              --jq '.data.organization.projectV2 as $p
                    | [$p.id, $p.field.id] + [$p.field.options[] | .name + "=" + .id]
                    | join("\u001f")' 2>&1); then
              board_skip "PROJECT_PAT could not query Project #$PROJECT_NUMBER (revoked, expired, or missing project+read:org scope)"
              return 0
            fi

            IFS=$'\037' read -r -a parts <<<"$raw" || true
            PROJECT_ID="${parts[0]:-}"
            FIELD_ID="${parts[1]:-}"
            OPTION_ID=""
            # Explicit if, not `[ ... ] && x=y`: a false test as the loop's last
            # command becomes the loop's exit code and trips errexit (E007/#35).
            for kv in "${parts[@]:2}"; do
              if [ "${kv%%=*}" = "$BOARD_COLUMN" ]; then OPTION_ID="${kv#*=}"; fi
            done

            if [ -z "$PROJECT_ID" ] || [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
              board_skip "could not resolve the board Status field or its '$BOARD_COLUMN' column — token scope, or the board was reconfigured"
              return 0
            fi

            # Add the issue (no-op if already on the board) and capture the item id.
            if ! ITEM_ID=$(GH_TOKEN="$PROJECT_PAT" gh api graphql -f query='
              mutation($p:ID!,$c:ID!){
                addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item { id } }
              }' -F p="$PROJECT_ID" -F c="$ISSUE_NODE_ID" \
              --jq '.data.addProjectV2ItemById.item.id' 2>&1) || [ -z "$ITEM_ID" ]; then
              board_skip "could not add #$ISSUE_NUMBER to the board"
              return 0
            fi

            # Sync board Status to the issue status label.
            if ! GH_TOKEN="$PROJECT_PAT" gh api graphql -f query='
              mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){
                updateProjectV2ItemFieldValue(input:{
                  projectId:$p, itemId:$i, fieldId:$f,
                  value:{ singleSelectOptionId:$o }
                }){ projectV2Item { id } }
              }' -F p="$PROJECT_ID" -F i="$ITEM_ID" -F f="$FIELD_ID" -F o="$OPTION_ID" >/dev/null 2>&1; then
              board_skip "could not set board Status to '$BOARD_COLUMN' for #$ISSUE_NUMBER"
              return 0
            fi

            echo "Issue #$ISSUE_NUMBER added to the board with Status '$BOARD_COLUMN' (from $board_status)."
          }

          sync_board
