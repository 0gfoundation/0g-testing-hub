name: Check targets drift

# Guards the repo's two generated surfaces against drift. Pure read-only checks,
# never write back.
#
# 1. data/targets.json — the single source of truth for every surface that lists
#    or maps products. Five edges: the README targets block, the Submit Feedback
#    Product dropdown, the Product → area / product:* maps in
#    add-defects-to-board.yml and setup-labels-and-board.sh, and data/owners.json
#    + the product:* labels in labels.yml.
# 2. data/signup-prefill.json — the single source of truth for the sign-up
#    prefill link, published in README.md, config.yml, and AGENTS.md (twice: prose
#    plus the JSON block the Builder Hub landing page mirrors). Added after two
#    different prefill bodies shipped at once and the variant real testers hit was
#    the unguarded one — see #69.
#
# Runs on EVERY pull request (no paths filter): the `check` job is a required
# status check on main, and a paths-filtered required check would leave
# non-matching PRs stuck on "Expected" forever. The job costs seconds. The push
# trigger only re-verifies main after a merge (branch pushes are already
# covered by their PR run).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-targets-drift.mjs
      - run: node scripts/check-signup-drift.mjs
