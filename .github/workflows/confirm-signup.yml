name: Confirm sign-up

# When a tester opens a sign-up issue, validate the wallet address and confirm
# registration. The issue author is the authenticated GitHub identity — the reward
# join key — and the wallet in the body is the public payout address (Option A).
#
# Uses the default GITHUB_TOKEN (issues: write) — no PAT needed; it only comments
# on and labels issues in this repo.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  confirm:
    # Sign-ups are linked from README instead of exposed as an issue-template entry.
    # The direct link tries to apply `signup`, and the `[signup]` title prefix is the
    # fallback if GitHub does not apply query-string labels for the opener.
    if: contains(github.event.issue.labels.*.name, 'signup') || startsWith(github.event.issue.title, '[signup]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
    steps:
      - name: Validate wallet and confirm registration
        run: |
          set -euo pipefail

          BODY=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq .body)

          # Keep the signup label for export even if the direct URL label was not
          # applied at creation time.
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "signup" >/dev/null

          # Prefer the README prefill heading, then fall back to the first public
          # 0x-address in the body so manual edits still work.
          WALLET=$(awk '
            $0 == "### 0G mainnet EVM wallet address" { found=1; next }
            found && /^### / { exit }
            found && NF { print; exit }
          ' <<<"$BODY")
          if ! printf '%s' "$WALLET" | grep -Eiq '^0x[0-9a-f]{40}$'; then
            WALLET=$(printf '%s\n' "$BODY" | grep -Eio '\b0x[0-9a-f]{40}\b' | head -1 || true)
          fi

          # Safety: a 64-hex string is a private key, never a wallet address. If one
          # shows up, flag it loudly instead of leaving a secret in a public issue.
          if printf '%s' "$BODY" | grep -Eiq '\b(0x)?[0-9a-f]{64}\b'; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "needs:fix" >/dev/null
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "⚠️ This looks like it may contain a **private key**. Please **edit it out immediately** and keep only your public \`0x…\` wallet address. Never share secrets."
            echo "Flagged #$ISSUE_NUMBER for a possible private key."
            exit 0
          fi

          # Duplicate sign-up guard. The issue author is the reward join key, so one
          # sign-up issue is all a tester needs. If they already have an earlier one,
          # this later issue is a duplicate: strip its `signup` label so the reward
          # export and the L0 survey bridge both ignore it and stay on the canonical
          # (earliest) issue, point the tester back, and close it.
          CANONICAL=$(gh issue list --repo "$REPO" --state all --label signup \
            --author "$AUTHOR" --json number --jq '.[].number' | sort -n | head -1)
          if [ -n "$CANONICAL" ] && [ "$CANONICAL" != "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "signup" >/dev/null
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "duplicate" >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "👋 You already registered in #$CANONICAL — that issue is your tracker. Your GitHub account is your identity, so one sign-up is all you need. Edit **#$CANONICAL** instead of opening new ones (need to fix your wallet? edit it there). Closing this duplicate."
            gh issue close "$ISSUE_NUMBER" --repo "$REPO" >/dev/null
            echo "Closed duplicate sign-up #$ISSUE_NUMBER (@$AUTHOR); canonical is #$CANONICAL."
            exit 0
          fi

          if printf '%s' "$WALLET" | grep -Eiq '^0x[0-9a-f]{40}$'; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --title "[signup]: $AUTHOR" >/dev/null
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file - <<EOF
          ✅ **Registered @$AUTHOR** → \`$WALLET\`.

          This signup issue is your tracker. Your GitHub account is your testing identity, and rewards pay to this wallet.

          Next steps:

          1. Complete the [0G Studio Survey](https://forms.gle/ymEdZrdTNs4giEm1A).
          2. Complete the [0G Private Computer Survey](https://forms.gle/G919xrbRyfVJxPZe8).
          3. Wait for this issue to show \`l0:cleared\` after both surveys land.
          4. Then climb to L1 by submitting an accepted App Suite bug report: https://github.com/$REPO/issues/new?template=submit-feedback.yml

          See the ladder in [README.md](../../blob/main/README.md#test-report-reward).
          EOF
            echo "Confirmed sign-up #$ISSUE_NUMBER (@$AUTHOR -> $WALLET)."
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "needs:fix" >/dev/null
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "⚠️ Couldn't read a valid **0G mainnet EVM wallet** (expected \`0x\` + 40 hex characters). Please edit the issue and fix the wallet field so your reward can be paid."
            echo "Flagged #$ISSUE_NUMBER for an invalid/missing wallet."
          fi
