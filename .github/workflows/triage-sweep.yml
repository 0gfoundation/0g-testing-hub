name: Triage sweep

# A daily janitor for triage state that the event-driven workflows can't catch,
# because they only fire on live label/issue events:
#
#   Sweep A — needs-info timeout: TRIAGE.md gives a tester ~7 days to reply to a
#   status:needs-info issue before it is closed as resolution:rejected. Nothing
#   fires on "time passed", so a stale needs-info issue would sit silently. This
#   posts a dedup'd reminder (it does NOT auto-close — a human still decides).
#
#   Sweep B — state-machine consistency: the status:closed label and the issue's
#   real open/closed state are independent actions and can drift. This flags the
#   drift with needs:manual-label + an explanation comment for a maintainer.
#
#   Sweep C — sign-up stalls: a tester registers, then their L0 survey labels
#   never arrive. Nothing fires on "the surveys didn't come", so both sides went
#   quiet — the tester never learned they were stuck, and no maintainer learned
#   anyone was waiting (#64/#65 sat like this for days). This nudges the tester on
#   their own sign-up issue, and separates the three states that look identical
#   from the outside: neither survey in, one in, or both in but never combined.
#
# Read-only against the board: this uses the default GITHUB_TOKEN (issues:write)
# to comment and label only — it never touches Projects v2, so no PROJECT_PAT.

on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC (offset from check-project-token's 07:00)
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Days without an update before a needs-info issue is reminded"
        required: false
        default: "7"
      signup_stale_days:
        description: "Days after registration before a sign-up with no l0:cleared is nudged"
        required: false
        default: "3"

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      STALE_DAYS: ${{ github.event.inputs.stale_days || '7' }}
      # Deliberately separate from STALE_DAYS. needs-info's 7 days is "waiting on
      # a tester to supply details they know we asked for"; a sign-up stall is
      # "the tester probably doesn't know anything is wrong". Different clocks.
      SIGNUP_STALE_DAYS: ${{ github.event.inputs.signup_stale_days || '3' }}
    steps:
      - name: Sweep needs-info timeouts and state-machine consistency
        run: |
          set -euo pipefail

          # Post or update a marker-deduped comment (PATCH-or-POST, same pattern
          # as notify-status-change.yml) so daily re-runs refresh in place instead
          # of piling new comments on the issue.
          post_or_update() {
            number="$1"; marker="$2"; msg="$3"
            body=$(printf '%s\n\n%s' "$marker" "$msg")
            cid=$(gh api "repos/$REPO/issues/$number/comments" --paginate \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
            if [ -n "$cid" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$cid" -f body="$body" >/dev/null
            else
              gh api --method POST "repos/$REPO/issues/$number/comments" -f body="$body" >/dev/null
            fi
          }

          summary() { printf '%s\n' "$1" >>"$GITHUB_STEP_SUMMARY"; }

          # ---- Sweep A: needs-info timeout reminders --------------------------
          CUTOFF=$(date -u -d "$STALE_DAYS days ago" +%s)
          NEEDS_INFO_JSON=$(gh issue list --repo "$REPO" --state open \
            --label "status:needs-info" --limit 500 --json number,updatedAt,title)
          NEEDS_INFO_TOTAL=$(printf '%s' "$NEEDS_INFO_JSON" | jq 'length')

          stale_nums=""
          stale_count=0
          # Tab-separated number<TAB>updatedAt so titles with spaces don't split.
          while IFS=$'\t' read -r num updated; do
            [ -z "$num" ] && continue
            updated_epoch=$(date -u -d "$updated" +%s)
            if [ "$updated_epoch" -le "$CUTOFF" ]; then
              post_or_update "$num" "<!-- og-triage-sweep:needs-info-stale -->" \
                "⏰ **Reminder — this bug is waiting on more info.** It was moved to \`status:needs-info\` and has had no update in over **${STALE_DAYS} days**. Per [TRIAGE.md](../../blob/main/.github/TRIAGE.md), a needs-info issue with no reply is closed as \`resolution:rejected\` — a reply with the missing repro details (exact steps, environment, screenshots/recording) keeps your potential reward credit alive. This is an automated reminder; it does **not** auto-close the issue."
              stale_nums="$stale_nums #$num"
              stale_count=$((stale_count + 1))
            fi
          done < <(printf '%s' "$NEEDS_INFO_JSON" | jq -r '.[] | [(.number|tostring), .updatedAt] | @tsv')

          # ---- Sweep B: state-machine consistency ----------------------------
          # B1: open issue carrying status:closed (label says closed, issue isn't).
          OPEN_CLOSED=$(gh issue list --repo "$REPO" --state open \
            --label "status:closed" --limit 500 --json number --jq '.[].number')

          # Closed defects, for B2/B3 label checks.
          CLOSED_DEFECTS=$(gh issue list --repo "$REPO" --state closed \
            --label "defect" --limit 1000 --json number,labels)
          CLOSED_DEFECTS_TOTAL=$(printf '%s' "$CLOSED_DEFECTS" | jq 'length')

          # B2: closed defect with no resolution:* label.
          NO_RESOLUTION=$(printf '%s' "$CLOSED_DEFECTS" | jq -r \
            '.[] | select([.labels[].name | startswith("resolution:")] | any | not) | .number')

          # B3: closed defect carrying a status:* label that is not status:closed.
          STALE_STATUS=$(printf '%s' "$CLOSED_DEFECTS" | jq -r \
            '.[] | select(any(.labels[].name; startswith("status:") and . != "status:closed")) | .number')

          flag() { # number, marker, message
            gh issue edit "$1" --repo "$REPO" --add-label "needs:manual-label" >/dev/null
            post_or_update "$1" "$2" "$3"
          }

          b1_nums=""; b1_count=0
          for n in $OPEN_CLOSED; do
            [ -z "$n" ] && continue
            flag "$n" "<!-- og-triage-sweep:open-with-closed -->" \
              "🏷️ **State mismatch — open issue labelled \`status:closed\`.** The \`status:closed\` label and the issue's real open/closed state have drifted. **Maintainer:** either close this issue (if it is truly done) or remove \`status:closed\` and set the correct \`status:*\`, then remove \`needs:manual-label\`."
            b1_nums="$b1_nums #$n"; b1_count=$((b1_count + 1))
          done

          b2_nums=""; b2_count=0
          for n in $NO_RESOLUTION; do
            [ -z "$n" ] && continue
            flag "$n" "<!-- og-triage-sweep:closed-no-resolution -->" \
              "🏷️ **Closed defect without a resolution.** This defect is closed but carries no \`resolution:*\` label, so the tester was never told whether it counted. **Maintainer:** add exactly one \`resolution:fixed\` / \`resolution:rejected\` / \`resolution:duplicate\` per [TRIAGE.md](../../blob/main/.github/TRIAGE.md), then remove \`needs:manual-label\`."
            b2_nums="$b2_nums #$n"; b2_count=$((b2_count + 1))
          done

          b3_nums=""; b3_count=0
          for n in $STALE_STATUS; do
            [ -z "$n" ] && continue
            flag "$n" "<!-- og-triage-sweep:closed-stale-status -->" \
              "🏷️ **Closed defect with a non-closed status label.** This issue is closed but still carries a \`status:*\` other than \`status:closed\`. **Maintainer:** set \`status:closed\` (adding a new \`status:*\` auto-removes the stale one) or reopen the issue, then remove \`needs:manual-label\`."
            b3_nums="$b3_nums #$n"; b3_count=$((b3_count + 1))
          done

          # ---- Sweep C: sign-up stalls ---------------------------------------
          # An open `signup` issue older than SIGNUP_STALE_DAYS with no
          # `l0:cleared`. The label pair tells us which of three things happened,
          # and they need different messages — a blanket "did you do the surveys?"
          # is useless to someone who already did one, and wrong for someone whose
          # labels are both in.
          SIGNUP_CUTOFF=$(date -u -d "$SIGNUP_STALE_DAYS days ago" +%s)
          SIGNUP_JSON=$(gh issue list --repo "$REPO" --state open \
            --label "signup" --limit 500 --json number,createdAt,author,labels)
          SIGNUP_TOTAL=$(printf '%s' "$SIGNUP_JSON" | jq 'length')

          STUDIO_URL="https://forms.gle/ymEdZrdTNs4giEm1A"
          PC_URL="https://forms.gle/G919xrbRyfVJxPZe8"

          c_none=0; c_partial=0; c_stuck=0; c_nums=""
          while IFS=$'\t' read -r num created author labels; do
            [ -z "$num" ] && continue

            # Cleared testers are done — never nudge them.
            case " $labels " in *" l0:cleared "*) continue ;; esac

            created_epoch=$(date -u -d "$created" +%s)
            if [ "$created_epoch" -gt "$SIGNUP_CUTOFF" ]; then
              continue # freshly registered; give them room
            fi

            has_studio=0; has_pc=0
            case " $labels " in *" l0:studio-done "*) has_studio=1 ;; esac
            case " $labels " in *" l0:pc-done "*) has_pc=1 ;; esac

            if [ "$has_studio" -eq 1 ] && [ "$has_pc" -eq 1 ]; then
              # Both halves arrived but mark-l0-cleared.yml never combined them.
              # That workflow only fires on `labeled`, so a failed or lost event
              # leaves this state stuck forever with nobody watching.
              post_or_update "$num" "<!-- og-triage-sweep:signup-stalled -->" \
                "🏷️ **Both L0 surveys are in, but \`l0:cleared\` was never applied.** This is on us, not you — the label that combines them did not fire. **Maintainer:** add \`l0:cleared\` to this issue so L0 credit is recorded, and check the \`mark-l0-cleared\` workflow run for this issue."
              c_stuck=$((c_stuck + 1))
            elif [ "$has_studio" -eq 1 ] || [ "$has_pc" -eq 1 ]; then
              if [ "$has_studio" -eq 1 ]; then
                missing="[0G Private Computer Survey]($PC_URL)"
                got="0G Studio Survey"
              else
                missing="[0G Studio Survey]($STUDIO_URL)"
                got="0G Private Computer Survey"
              fi
              post_or_update "$num" "<!-- og-triage-sweep:signup-stalled -->" \
                "⏳ **One L0 survey still missing.** We have your **${got}**; L0 also needs the ${missing}. Once both are in, this issue gets \`l0:cleared\` — that's L0 Recruit, **10 0G Compute Credit**."
              c_partial=$((c_partial + 1))
            else
              post_or_update "$num" "<!-- og-triage-sweep:signup-stalled -->" \
                "⏳ **Neither L0 survey has reached us yet.** You registered more than **${SIGNUP_STALE_DAYS} days** ago and no survey has been matched to this issue. L0 Recruit (**10 0G Compute Credit**) needs both:

          1. [0G Studio Survey]($STUDIO_URL)
          2. [0G Private Computer Survey]($PC_URL)

          **If you already submitted them**, the usual cause is the GitHub username in the survey not matching this issue's author (\`$author\`) — that is how a submission gets matched back to you. Reply here with the username you entered and a maintainer will reconcile it. Ticking the boxes in the issue body does not register a survey; the \`l0:studio-done\` / \`l0:pc-done\` labels do."
              c_none=$((c_none + 1))
            fi
            c_nums="$c_nums #$num"
          done < <(printf '%s' "$SIGNUP_JSON" | jq -r '.[] | [(.number|tostring), .createdAt, .author.login, ([.labels[].name] | join(" "))] | @tsv')

          signup_flagged=$((c_none + c_partial + c_stuck))

          # ---- Summary (anti-empty-green: always report what was scanned) -----
          consistency_total=$((b1_count + b2_count + b3_count))
          summary "## Triage sweep"
          summary ""
          summary "Scanned **${NEEDS_INFO_TOTAL}** open \`status:needs-info\` issue(s) and **${CLOSED_DEFECTS_TOTAL}** closed defect(s)."
          summary ""
          summary "### A. needs-info timeouts (≥ ${STALE_DAYS} days)"
          if [ "$stale_count" -gt 0 ]; then
            summary "- ${stale_count} reminded:${stale_nums}"
          else
            summary "- 0 stale needs-info issues."
          fi
          summary ""
          summary "### B. State-machine consistency"
          # Explicit ifs, not `[ ... ] && summary`: a failing test as the step's
          # last executed command would become the step's exit code and fail the
          # run even though every check completed (seen live: run 29888442931).
          if [ "$consistency_total" -gt 0 ]; then
            if [ "$b1_count" -gt 0 ]; then summary "- ${b1_count} open + \`status:closed\`:${b1_nums}"; fi
            if [ "$b2_count" -gt 0 ]; then summary "- ${b2_count} closed defect(s) missing \`resolution:*\`:${b2_nums}"; fi
            if [ "$b3_count" -gt 0 ]; then summary "- ${b3_count} closed defect(s) with a non-closed \`status:*\`:${b3_nums}"; fi
          else
            summary "- 0 inconsistencies found."
          fi
          summary ""
          summary "### C. Sign-up stalls (registered ≥ ${SIGNUP_STALE_DAYS} days ago, no \`l0:cleared\`)"
          # Explicit ifs, never `[ test ] && summary` — a false test as the step's
          # last executed command becomes the step's exit code (E007 / #35).
          if [ "$signup_flagged" -gt 0 ]; then
            summary "- ${signup_flagged} nudged:${c_nums}"
            if [ "$c_none" -gt 0 ]; then summary "  - ${c_none} with neither survey in"; fi
            if [ "$c_partial" -gt 0 ]; then summary "  - ${c_partial} with one survey in"; fi
            if [ "$c_stuck" -gt 0 ]; then summary "  - ${c_stuck} with both surveys in but no \`l0:cleared\` — **needs a maintainer**"; fi
          else
            summary "- 0 stalled sign-ups."
          fi
          echo "Sweep done: needs-info scanned=${NEEDS_INFO_TOTAL} stale=${stale_count}; closed defects scanned=${CLOSED_DEFECTS_TOTAL} inconsistencies=${consistency_total}; signups scanned=${SIGNUP_TOTAL} nudged=${signup_flagged}."
