name: Notify status change

# Close the feedback loop for testers. When triage moves a defect to
# status:needs-info / status:accepted / status:routed / status:closed, applies
# a resolution:* on close, or asks for a dApp report link, post a short comment
# on the issue explaining the outcome and what it means for their reward — so a
# filer doesn't have to read the board (or guess) to learn whether their bug
# counted. Label changes alone send no GitHub notification; these comments do.
#
# Uses the default GITHUB_TOKEN (issues: write) — no PAT needed, since this only
# comments on issues in this repo.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  comment:
    if: >-
      github.event.label.name == 'status:needs-info' ||
      github.event.label.name == 'status:accepted' ||
      github.event.label.name == 'status:routed' ||
      github.event.label.name == 'status:closed' ||
      github.event.label.name == 'resolution:fixed' ||
      github.event.label.name == 'resolution:rejected' ||
      github.event.label.name == 'resolution:duplicate' ||
      github.event.label.name == 'needs:dapp-report-url'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      LABEL: ${{ github.event.label.name }}
      AUTHOR: ${{ github.event.issue.user.login }}
    steps:
      - uses: actions/checkout@v4

      - name: Comment on the issue
        run: |
          set -euo pipefail

          # The reward consequence of "accepted" depends on the issue's area, so a
          # blanket "counts toward your reward tier" would lie to two groups:
          #   - Ecosystem coverage is useful, but not part of the core reward ladder.
          #   - An accepted 0G Infra bug does NOT clear L1 on its own (L1 needs App
          #     Suite); it only counts once paired with an accepted App Suite bug.
          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | tr '\n' ' ')
          has() { case " $LABELS " in *" $1 "*) return 0 ;; *) return 1 ;; esac }

          ACCEPTED_MSG="✅ **Accepted** — triage reproduced and confirmed this defect. It counts toward your reward tier (rewards are on **accepted, deduped** core findings). See [LEVELS.md](../../blob/main/LEVELS.md)."
          if has "area:ecosystem" || has "coverage-log"; then
            ACCEPTED_MSG="✅ **Ecosystem coverage accepted** — thanks for confirming this. It helps ecosystem follow-up, but the higher L1–L3 rewards come from accepted **0G App Suite** and **0G Infra** bugs. If actionable, please also report it to the dApp's own channel. See [LEVELS.md](../../blob/main/LEVELS.md)."
          elif has "area:0g-infra"; then
            ACCEPTED_MSG="✅ **Accepted** — triage reproduced and confirmed this **0G Infra** defect. Note: an Infra bug alone does **not** clear L1 (that needs an accepted **App Suite** bug); paired with one it gets you to L2. See [LEVELS.md](../../blob/main/LEVELS.md)."
          elif has "area:app-suite"; then
            ACCEPTED_MSG="✅ **Accepted** — triage reproduced and confirmed this **App Suite** defect; that clears **L1**. Add an accepted **0G Infra** bug to reach **L2**. Rewards are on **accepted, deduped** core findings. See [LEVELS.md](../../blob/main/LEVELS.md)."
          fi

          case "$LABEL" in
            "status:needs-info")
              MSG="⏳ **More info needed** — triage could not reproduce or validate this from the current Details. Please reply on this issue with the missing pieces (exact steps, environment, screenshots/recording). If there is no reply within **~7 days** it will be closed as \`resolution:rejected\` — a reply keeps your potential reward credit alive." ;;
            "status:accepted")
              MSG="$ACCEPTED_MSG" ;;
            "status:routed")
              MSG="📤 **Routed upstream** to the owning team. If it was a rewardable core defect it still counts — routed and accepted are both rewardable states." ;;
            "status:closed")
              # The resolution:* handler posts the precise message; only fall back
              # to the generic one when the close carries no resolution yet.
              # (TRIAGE.md: apply resolution:* before, or together with, status:closed.)
              case " $LABELS " in
                *" resolution:"*)
                  echo "status:closed with a resolution:* present — the resolution comment covers it."; exit 0 ;;
              esac
              MSG="🔒 **Closed.** If this was a duplicate, the shared root cause is credited to the first filer. If it was not reproducible or out of bounds, it does not count toward a tier — see [TRIAGE.md](../../blob/main/.github/TRIAGE.md) for the rules." ;;
            "resolution:fixed")
              MSG="🎉 **Closed as fixed** — your report was a real defect and it has been resolved. It **still counts** toward your reward tier (a fixed core finding keeps its credit). Thanks for the catch." ;;
            "resolution:rejected")
              MSG="🚫 **Closed as rejected** — triage could not confirm this as a defect (not reproducible, out of bounds, or working as intended; see the maintainer's closing comment for the specific reason). It does **not** count toward a reward tier. See [TRIAGE.md](../../blob/main/.github/TRIAGE.md) for what gets accepted." ;;
            "resolution:duplicate")
              MSG="👥 **Closed as duplicate** — this shares a root cause with an earlier report (see the \`rc:*\` label and the maintainer's comment linking the canonical issue). Per the reward rules, a shared root cause is credited **once, to the first filer**. Tip: filter open issues by the \`product:*\` label before filing to avoid duplicates." ;;
            "needs:dapp-report-url")
              MSG="🔗 **One more step for this ecosystem bug** — it looks actionable, so please also report it to the dApp's **own** support/issue channel and paste that link here as a comment. A maintainer clears this label once the link is posted." ;;
            *)
              echo "Unhandled label: $LABEL"; exit 0 ;;
          esac

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$MSG"
          echo "Commented on #$ISSUE_NUMBER for $LABEL."

      - name: Update signup progress preview
        # status:closed / resolution:* are included so the preview refreshes
        # (down or up) when a previously counted issue is closed — e.g. an
        # accepted defect later folded as a duplicate, or kept via
        # resolution:fixed. Without this the signup tracker shows a stale count.
        if: >-
          github.event.label.name == 'status:accepted' ||
          github.event.label.name == 'status:routed' ||
          github.event.label.name == 'status:closed' ||
          github.event.label.name == 'resolution:fixed' ||
          github.event.label.name == 'resolution:rejected' ||
          github.event.label.name == 'resolution:duplicate'
        run: |
          set -euo pipefail

          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | tr '\n' ' ')
          has() { case " $LABELS " in *" $1 "*) return 0 ;; *) return 1 ;; esac }

          if has "area:ecosystem" || has "coverage-log"; then
            echo "Ecosystem coverage is outside the core reward ladder; skipping reward progress preview."
            exit 0
          fi

          if ! { has "area:app-suite" || has "area:0g-infra"; }; then
            echo "No rewardable core area label; skipping reward progress preview."
            exit 0
          fi

          SIGNUP_NUMBER=$(gh issue list \
            --repo "$REPO" \
            --state all \
            --label signup \
            --author "$AUTHOR" \
            --limit 100 \
            --json number,createdAt \
            --jq 'sort_by(.createdAt)[0].number // ""')

          if [ -z "$SIGNUP_NUMBER" ]; then
            echo "No signup issue found for @$AUTHOR; skipping reward progress preview."
            exit 0
          fi

          REPORT=$(node scripts/export-reward-report.mjs --repo "$REPO" --signups-from-issues --format json)
          USER=$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')
          ROW=$(jq -c --arg user "$USER" '.rows[] | select(.githubUsername == $user)' <<<"$REPORT" | head -n 1)

          if [ -z "$ROW" ]; then
            echo "No reward row found for @$AUTHOR; skipping reward progress preview."
            exit 0
          fi

          LEVEL=$(jq -r '.issueLevel // ""' <<<"$ROW")
          CREDIT=$(jq -r '.issueCredit // 0' <<<"$ROW")
          TOTAL=$(jq -r '.acceptedDeduped // 0' <<<"$ROW")
          APP_SUITE=$(jq -r '.appSuite // 0' <<<"$ROW")
          INFRA=$(jq -r '.infra // 0' <<<"$ROW")
          SYSTEMIC=$(jq -r '.systemic // 0' <<<"$ROW")
          CANONICAL=$(jq -r '.canonicalIssues // ""' <<<"$ROW")

          if [ -z "$LEVEL" ]; then
            LEVEL="not yet"
          fi

          if [ "$LEVEL" = "L3" ]; then
            NEXT="L3 is the current cap. Keep reports high-signal; final payout still follows export."
          elif [ "$APP_SUITE" -lt 1 ]; then
            NEXT="Need 1 accepted App Suite defect for L1."
          elif [ "$INFRA" -lt 1 ]; then
            NEXT="Need 1 accepted 0G Infra defect, paired with your App Suite accept, for L2."
          else
            NEED_CORE=$((5 - TOTAL))
            if [ "$NEED_CORE" -lt 0 ]; then
              NEED_CORE=0
            fi

            if [ "$NEED_CORE" -gt 0 ]; then
              NEXT="Need ${NEED_CORE} more accepted, deduped core defect(s) for L3."
            else
              NEXT="L3 criteria appear met; final payout still follows export."
            fi
          fi

          gh issue comment "$SIGNUP_NUMBER" --repo "$REPO" --body-file - <<EOF
          📊 **Reward progress preview** (advisory)

          Current level: **$LEVEL** ($CREDIT 0G Compute Credit)

          Accepted, deduped core findings: **$TOTAL**
          - App Suite: **$APP_SUITE**
          - 0G Infra: **$INFRA**
          - Systemic: **$SYSTEMIC**

          Canonical issues: ${CANONICAL:-none yet}

          Next gate: $NEXT

          Final payout still comes from the reward export after triage and de-duplication.
          EOF

          echo "Updated signup #$SIGNUP_NUMBER with reward progress preview for @$AUTHOR."
